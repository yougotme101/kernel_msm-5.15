name: "Advanced NeutronClang NoSUSFS Build"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/yougotme101/kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: true
        type: string
        default: "zepharo"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "kaze"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "KowSU"
        options:
          - "KowSU"
          - "ReSukiSU"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: true
        type: choice
        default: "default"
        options:
          - "default"
          - "100Hz"
          - "250Hz"
          - "300Hz"
          - "1000Hz"
      optimizationLevel:
        description: "Compiler optimization level"
        required: true
        type: choice
        default: "O3"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      buildToolchains:
        description: "build tools"
        required: true
        type: choice
        default: "custom-tools"
        options:
          - "android-tools"
          - "custom-tools"
      LtoOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio rsync git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 clang lld llvm llvm-dev

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize repo"
        if: github.event.inputs.buildToolchains == 'android-tools'
        working-directory: ${{ env.WORK_DIR}}
        run: |
         repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
         repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
    
         rm -rf .repo
         rm -rf common

         # Download updated Clang r584948 from Android Git repository
         aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r584948b.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r584948b.tar.gz"
    
         mkdir -p prebuilts/clang/host/linux-x86/clang-r584948b
         tar -xzf prebuilts/clang/host/linux-x86/clang-r584948b.tar.gz -C prebuilts/clang/host/linux-x86/clang-r584948b
         rm -rf prebuilts/clang/host/linux-x86/clang-r584948b.tar.gz

         # Clean up old Clang versions
         rm -rf prebuilts/clang/host/linux-x86/clang-3289846
         rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
         rm -rf prebuilts/clang/host/linux-x86/clang-r547379
         rm -rf prebuilts/clang/host/linux-x86/clang-stable
         
         sed -i \
          -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
          -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r584948b/' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
    
         sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

         sed -i \
          -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
          -e '/^TRIM_NONLISTED_KMI=/d' \
          -e '/^KMI_ENFORCED=/d' \
          -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
          -e '$a\TRIM_NONLISTED_KMI=0' \
          -e '$a\KMI_ENFORCED=0' \
          -e '/^MODULES_ORDER=/d' \
          -e '/^MODULES_LIST=/d' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64
     
      - name: "💫 Get Toolchains"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        run: |
          set -e

          mkdir -p clang
          cd clang

          echo "🚀 Fetching Neutron Clang via antman..."
          curl -LSs -o antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman

          # -S pulls the latest stable sync; use -S=<date> to pin a specific build if needed
          ./antman -S

          cd ..

          CLANG_PATH="${{ github.workspace }}/clang/bin"

          if [ ! -f "$CLANG_PATH/clang" ]; then
            echo "❌ Clang binary not found in $CLANG_PATH! Build might fail."
            ls -R clang
            exit 1
          fi

          echo "✅ Using Clang from $CLANG_PATH"
          echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
          echo "$CLANG_PATH" >> $GITHUB_PATH

          export PATH="$CLANG_PATH:$PATH"
          echo "⚙️ Using Clang version:"
          "$CLANG_PATH/clang" --version
          
      - name: 📐 Setup SWAP 20GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 20
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p
            
      - name: "😎 Set args for GKI kernels"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        id: generate-args
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
            args="-j$(nproc --all)"
            if [ -n "${{ env.OUT_DIR }}" ]; then
              mkdir -p $(pwd)/${{ env.OUT_DIR }}
              args="$args O=$(pwd)/${{ env.OUT_DIR }}"
            fi
            args="$args ARCH=arm64 LLVM=1 LTO=thin"
            args="$args CROSS_COMPILE=aarch64-linux-gnu-"
            args="$args CLANG_TRIPLE=aarch64-linux-gnu-"
            args="$args AR=llvm-ar"
            args="$args CC=clang"
            echo "args=$args" >> $GITHUB_OUTPUT

      - name: "📝 Append custom Makefile line"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-sometimes-uninitialized' >> Makefile
         echo "Custom Makefile line added successfully"

      - name: "🌊 Inject BBRv3 (Google's tcp_bbr.c)"
        shell: bash
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -euo pipefail

          BBR_BRANCH="v3"
          BBR_FILE="net/ipv4/tcp_bbr.c"

          # Google's BBRv3 release lives as a full kernel-tree branch, not a
          # single pinned file path — try the expected path, then fall back
          # to asking the GitHub API where tcp_bbr.c actually sits on that branch.
          echo "🚀 Fetching BBRv3 source from google/bbr ($BBR_BRANCH branch)..."
          curl -sfL -o "${BBR_FILE}.new" \
            "https://raw.githubusercontent.com/google/bbr/${BBR_BRANCH}/net/ipv4/tcp_bbr.c" || true

          if [ ! -s "${BBR_FILE}.new" ] || ! grep -qi "bbr" "${BBR_FILE}.new"; then
            echo "⚠️ Direct path fetch failed or content looks wrong. Searching via GitHub API..."
            API_HIT=$(curl -sL "https://api.github.com/search/code?q=filename:tcp_bbr.c+repo:google/bbr" | grep -o '"path":[^,]*' | head -n 1 || true)
            echo "API search result: $API_HIT"

            echo "----- First 20 lines of what we actually downloaded: -----"
            head -n 20 "${BBR_FILE}.new" || echo "(file is empty or missing)"
            echo "------------------------------------------------------------"

            echo "❌ Could not confirm BBRv3 source at the expected path."
            echo "❌ Check https://github.com/google/bbr/tree/${BBR_BRANCH}/net/ipv4 manually,"
            echo "❌ confirm the exact path, and update BBR_FILE above accordingly."
            rm -f "${BBR_FILE}.new"
            exit 1
          fi

          # Back up the tree's existing tcp_bbr.c, then swap in BBRv3
          if [ -f "$BBR_FILE" ]; then
            cp "$BBR_FILE" "${BBR_FILE}.orig"
          fi
          mv "${BBR_FILE}.new" "$BBR_FILE"

          echo "✅ BBRv3 source installed at $BBR_FILE"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '/^CONFIG_TCP_CONG_BBR/d' "$CONFIG_FILE"
            sed -i '/^CONFIG_DEFAULT_BBR/d' "$CONFIG_FILE"
            sed -i '/^CONFIG_DEFAULT_TCP_CONG/d' "$CONFIG_FILE"
            {
              echo "CONFIG_TCP_CONG_BBR=y"
              echo "CONFIG_DEFAULT_BBR=y"
              echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
            } >> "$CONFIG_FILE"
          fi

          echo "🎉 Inject BBRv3 setup complete!"
    
      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
         # Define the config file path
         CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
    
         # Remove any existing LTO FULL configuration
         sed -i '/^CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
    
         # Set localversion
         if [ -n "${{ github.event.inputs.localVersion }}" ]; then
          echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
         fi
    
         # LTO Configuration - Enable Thin LTO only
         if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG_FILE"
           echo "CONFIG_THINLTO=y" >> "$CONFIG_FILE"
         else
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_THIN is not set" >> "$CONFIG_FILE"
           echo "# CONFIG_THINLTO is not set" >> "$CONFIG_FILE"
         fi

         # Full Metamodule Support
         echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
         echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
         echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
         echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          
         # Remove existing optimization configs
         sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' "$CONFIG_FILE"
         sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3/d' "$CONFIG_FILE"
         sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' "$CONFIG_FILE"
          
          # Apply selected optimization level
          case "${{ github.event.inputs.optimizationLevel }}" in
            default)
              # nothing to add here (keep it default)
              ;;
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
                   
          # Apply selected tick rate
          case "${{ github.event.inputs.tickRate }}" in
            default)
              # nothing to add here (keep it default)
              ;;
            100Hz)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=100" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_100=y" >> "$CONFIG_FILE"
              ;;
            250Hz)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=250" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_250=y" >> "$CONFIG_FILE"
              ;;
            300Hz)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=300" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_300=y" >> "$CONFIG_FILE"
              ;;
            1000Hz)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=1000" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_1000=y" >> "$CONFIG_FILE"
              ;;
          esac

          # Extra TCP configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          EOF

          # Script sign patch
          curl -L -o sign.patch "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
          patch -p1 < sign.patch || echo "Warning: Strings patch failed"
          
          # localversion
          # curl -L -o localversion.patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch" 
          # patch -p1 < localversion.patch || echo "Warning: Strings patch failed"

      - name: '⚙️ Inject Standalone Spoof bootloader Engine'
        shell: bash
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -euo pipefail

          # Layer 1: init/main.c
          if [ -f "init/main.c" ]; then
            if ! grep -q "verifiedbootstate=green" init/main.c; then
              perl -0pi -e 's/(static void __init setup_command_line\(char \*command_line\)\n\{\n\tsize_t len, xlen = 0, ilen = 0;\n)/$1\n\t{\n\t\tchar *ks;\n\t\twhile((ks=strstr(command_line,"verifiedbootstate=orange"))) memcpy(ks,"verifiedbootstate=green ",24);\n\t\twhile((ks=strstr(command_line,"verifiedbootstate=red"))) memcpy(ks,"verifiedbootstate=green",23);\n\t\twhile((ks=strstr(command_line,"flash.locked=0"))) memcpy(ks,"flash.locked=1",14);\n\t\twhile((ks=strstr(command_line,"veritymode=logging"))) memcpy(ks,"veritymode=enforcing",20);\n\t}\n/' init/main.c
              if ! grep -q "verifiedbootstate=green" init/main.c; then
                echo "ERROR: Layer 1 injection failed" >&2
                exit 1
              fi
              echo "--> Layer 1 (init/main.c) patched successfully!"
            else
                echo "--> Layer 1 already patched, skipping."
              fi
            fi

          # Layer 2: fs/proc/cmdline.c
          if [ -f "fs/proc/cmdline.c" ]; then
            if ! grep -q "verifiedbootstate=green" fs/proc/cmdline.c; then
              sed -i '1 i\#include <linux/slab.h>' fs/proc/cmdline.c
              perl -0pi -e 's/(static int\s+cmdline_proc_show\s*\(struct seq_file\s*\*m,\s*void\s*\*v\)\s*\{)/$1\n\tchar *c = kstrdup(saved_command_line, GFP_KERNEL);\n\tif(c){\n\t\tchar *s;\n\t\twhile((s=strstr(c,"verifiedbootstate=orange"))) memcpy(s,"verifiedbootstate=green ",24);\n\t\twhile((s=strstr(c,"verifiedbootstate=red"))) memcpy(s,"verifiedbootstate=green",23);\n\t\twhile((s=strstr(c,"flash.locked=0"))) memcpy(s,"flash.locked=1",14);\n\t\twhile((s=strstr(c,"veritymode=logging"))) memcpy(s,"veritymode=enforcing",20);\n\t\tseq_printf(m, "%s\\n", c);\n\t\tkfree(c);\n\t\treturn 0;\n\t}/' fs/proc/cmdline.c
              echo "--> Layer 2 (fs/proc/cmdline.c) patched successfully!"
            else
              echo "--> Layer 2 already patched, skipping."
            fi
           fi

          # Layer 3: fs/proc/bootconfig.c
          if [ -f "fs/proc/bootconfig.c" ]; then
            if ! grep -q "verifiedbootstate.*green" fs/proc/bootconfig.c; then
              sed -i '1 i\#include <linux/slab.h>' fs/proc/bootconfig.c
              perl -0pi -e 's/(static int\s+bootconfig_proc_show\s*\(struct seq_file\s*\*m,\s*void\s*\*v\)\s*\{)/$1\n\tchar *b = kmalloc(bootconfig_data_size + 1, GFP_KERNEL);\n\tif(b){\n\t\tchar *s;\n\t\tmemcpy(b, bootconfig_data, bootconfig_data_size);\n\t\tb[bootconfig_data_size] = 0;\n\t\twhile((s=strstr(b,"verifiedbootstate = \"orange\""))) memcpy(s, "verifiedbootstate  = \"green\"", 27);\n\t\twhile((s=strstr(b,"device_state = \"unlocked\""))) memcpy(s, "device_state   = \"locked\"", 25);\n\t\twhile((s=strstr(b,"flash.locked = \"0\""))) memcpy(s, "flash.locked = \"1\"", 18);\n\t\twhile((s=strstr(b,"veritymode = \"logging\""))) memcpy(s, "veritymode = \"enforcing\"", 24);\n\t\tseq_write(m, b, bootconfig_data_size);\n\t\tkfree(b);\n\t\treturn 0;\n\t}/' fs/proc/bootconfig.c
              echo "--> Layer 3 (fs/proc/bootconfig.c) patched successfully!"
            else
              echo "--> Layer 3 already patched, skipping."
            fi
          fi

          echo "🎉 Inject Spoof bootloader engine setup complete!"

      - name: "🔍 Debug schedutil Kconfig/Makefile placement"
        shell: bash
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set +e  # Don't fail the build on this — it's informational only

          echo "===== Searching for schedutil registration in Makefiles ====="
          grep -rn "cpufreq_schedutil.o" --include="Makefile" . 2>/dev/null

          echo ""
          echo "===== Searching for CPU_FREQ_GOV_SCHEDUTIL Kconfig entry ====="
          grep -rn "config CPU_FREQ_GOV_SCHEDUTIL" --include="Kconfig" . 2>/dev/null

          echo ""
          echo "===== Searching for the default-governor choice block ====="
          grep -rn "CPU_FREQ_DEFAULT_GOV_SCHEDUTIL" --include="Kconfig" . 2>/dev/null

          echo ""
          echo "===== Context around the default-gov choice (schedutil Kconfig file) ====="
          SCHEDUTIL_KCONFIG=$(grep -rl "CPU_FREQ_DEFAULT_GOV_SCHEDUTIL" --include="Kconfig" . 2>/dev/null | head -n 1)
          if [ -n "$SCHEDUTIL_KCONFIG" ]; then
            echo "Found in: $SCHEDUTIL_KCONFIG"
            grep -n -B2 -A10 "CPU_FREQ_DEFAULT_GOV_SCHEDUTIL" "$SCHEDUTIL_KCONFIG"
          else
            echo "Not found — default-gov choice may be defined elsewhere (check drivers/cpufreq/Kconfig manually)."
          fi

          echo ""
          echo "===== Checking for hardcoded 'schedutil' string in C source ====="
          grep -rn '"schedutil"' --include="*.c" drivers/cpufreq/ kernel/sched/ 2>/dev/null

      - name: '⚙️ Inject Reflex Governor'
        shell: bash
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -euo pipefail

          mkdir -p kernel/sched
          curl -sfL -o kernel/sched/cpufreq_reflex.c \
            "https://raw.githubusercontent.com/kusonekoworld-max/KonekoKernel-GKI/refs/heads/main/.github/actions/build-kernel/patches/reflex/cpufreq_reflex.c"

          # Sanity check: make sure we got C source, not a 404 HTML page
          # (checks first 100 lines, since real source often has a long
          # SPDX/copyright comment block before the first #include)
          if ! head -n 100 kernel/sched/cpufreq_reflex.c | grep -q "#include"; then
            echo "❌ Downloaded file doesn't look like C source. Check the URL/path."
            echo "----- First 20 lines of what was actually downloaded: -----"
            head -n 20 kernel/sched/cpufreq_reflex.c
            echo "------------------------------------------------------------"
            exit 1
          fi

          if ! grep -q "cpufreq_reflex.o" "kernel/sched/Makefile"; then
            echo 'obj-$(CONFIG_CPU_FREQ_GOV_REFLEX) += cpufreq_reflex.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "config CPU_FREQ_GOV_REFLEX" "kernel/sched/Kconfig"; then
            printf "\nconfig CPU_FREQ_GOV_REFLEX\n" >> "kernel/sched/Kconfig"
            printf "\ttristate \"'reflex' cpufreq governor\"\n" >> "kernel/sched/Kconfig"
            printf "\tdepends on CPU_FREQ && SMP\n" >> "kernel/sched/Kconfig"
            printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "kernel/sched/Kconfig"
            printf "\thelp\n" >> "kernel/sched/Kconfig"
            printf "\t  'reflex' is an advanced CPU frequency governor based on schedutil,\n" >> "kernel/sched/Kconfig"
            printf "\t  featuring idle-time accounting and PELT-complementary exponential decay.\n" >> "kernel/sched/Kconfig"
          fi

          # Make reflex the default governor (Kconfig side)
          if ! grep -q "config CPU_FREQ_DEFAULT_GOV_REFLEX" "kernel/sched/Kconfig"; then
            printf "\nconfig CPU_FREQ_DEFAULT_GOV_REFLEX\n" >> "kernel/sched/Kconfig"
            printf "\tbool \"reflex\"\n" >> "kernel/sched/Kconfig"
            printf "\tselect CPU_FREQ_GOV_REFLEX\n" >> "kernel/sched/Kconfig"
            printf "\thelp\n" >> "kernel/sched/Kconfig"
            printf "\t  Use the 'reflex' governor as default.\n" >> "kernel/sched/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ]; then
            if ! grep -q "CONFIG_CPU_FREQ_GOV_REFLEX" "$CONFIG_FILE"; then
              echo "CONFIG_CPU_FREQ_GOV_REFLEX=y" >> "$CONFIG_FILE"
            fi

            # Make reflex the default governor (defconfig side)
            sed -i 's/^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y/# CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set/' "$CONFIG_FILE"
            if ! grep -q "CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX" "$CONFIG_FILE"; then
              echo "CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX=y" >> "$CONFIG_FILE"
            fi
          fi
          
          echo "🎉 Inject Reflex Governor setup complete!"
      
      - name: "🚀 Add Droidspaces Support (fix KABI sysvipc)"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" | git apply -v --ignore-whitespace

          echo "🎉 Droidspaces setup complete!"
      
      - name: "😋 Add BBG Support"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

          echo "🎉 BBG setup complete!"

      - name: "🔧 Setup KowSU"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KowSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          
          # Install KowSU
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
          
          # Add KSU configs
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          EOF
          
          echo "🎉 KowSU setup complete!"
      
      - name: "🔧 Setup RESUKISU"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'ReSukiSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "✔ ReSukiSU installed"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          EOF
          echo "🎉 ReSukiSU setup complete!"
          
      - name: "🔨 Build kernel"
        if: github.event.inputs.buildToolchains == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
           LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          else
           LTO=full BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          fi
          
      - name: "👍 Make defconfig"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "🎶 Build kernel"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          make ${args} \
            LLVM=1 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            -j$(nproc --all)
          
      - name: 📦 Prepare artifact
        working-directory: ${{ env.WORK_DIR }}
        run: |
         mkdir -p out/dist

         if [ "${{ github.event.inputs.buildToolchains }}" = "android-tools" ]; then
          src="out/dist/Image"
         else
          src="${{ env.kernelDir }}/${{ env.kernelName }}/out/arch/arm64/boot/Image"
         fi

         cp "${src}" "out/dist/Image.${{ matrix.variant }}"
    
      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/out/dist/Image.${{ matrix.variant }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/yougotme101/AnyKernel3 -b master AnyKernel3
          
          # Copy kernels
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          # Create ZIP
          ZIP_NAME="${{ github.event.inputs.ksuVariant }}_${{ github.event.inputs.localVersion }}_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 1

      - name: "📱 Send to Telegram"
        if: always()
        run: |
         if [[ -f "${{ env.ZIP_PATH }}" ]]; then
          KSU_TEXT=""
         if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
          KSU_TEXT="
         
         🔐 *KSU Variant:* \`${{ github.event.inputs.ksuVariant }}\`"
         fi
      
         CAPTION="✅ *Kernel Build Successful*
      
         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-16\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`${{ github.event.inputs.kernelDevice }}\`
    
         ⚙️ *Configuration:*
         • LTO: \`${{ github.event.inputs.LtoOptimizations }}\`
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`${KSU_TEXT}
         • SUSFS: \`Disabled\`
         • BBG: \`Enabled\`
         • Droidspaces: \`Enabled\`
         • Local Version: \`${{ github.event.inputs.localVersion }}\`
         • Build Tools: \`${{ github.event.inputs.buildToolchains }}\`
         • Manager: \`${{ github.event.inputs.ksuVariant }}\`
    
         🕐 *Build Date:* $(date '+%Y-%m-%d %H:%M:%S UTC')
         📦 *Package:* \`${{ env.ZIP_NAME }}\`"
      
         curl -s -F document=@"${{ env.ZIP_PATH }}" \
           -F caption="$CAPTION" \
           -F parse_mode="Markdown" \
           -F chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
         else
         FAILURE_MSG="❌ *Kernel Build Failed*
      
         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-16\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`Redmi Note 12/13 4G. Pad SE\`
    
         ⚙️ *Configuration:*
         • LTO: \`${{ github.event.inputs.LtoOptimizations }}\`
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`${KSU_TEXT}
         • SUSFS: \`Disabled\`
         • BBG: \`Enabled\`
         • Droidspaces: \`Enabled\`
         • Local Version: \`${{ github.event.inputs.localVersion }}\`
         • Build Tools: \`${{ github.event.inputs.buildToolchains }}\`
         • Manager: \`${{ github.event.inputs.ksuVariant }}\`
      
         🕐 *Failed at:* $(date '+%Y-%m-%d %H:%M:%S UTC')
    
         🔍 Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
      
         curl -s -X POST \
           -d chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           -d text="$FAILURE_MSG" \
           -d parse_mode="Markdown" \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
         fi
